apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: lab8
data:
  datasources.yaml: "apiVersion: 1\ndatasources:\n- access: proxy\n  isDefault: true\n\
    \  name: Prometheus\n  type: prometheus\n  uid: prometheus\n  url: http://prometheus:9090\n"
  dashboards.yaml: "apiVersion: 1\nproviders:\n- name: Lab8\n  options:\n    path:\
    \ /var/lib/grafana/dashboards\n  type: file\n"
  dashboard.json: '{"uid": "lab8", "title": "Lab 8 - CampusConnect", "schemaVersion":
    39, "version": 1, "refresh": "10s", "time": {"from": "now-15m", "to": "now"},
    "panels": [{"id": 1, "title": "Targets reachable", "type": "timeseries", "datasource":
    {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "up", "refId":
    "A"}], "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8}, "fieldConfig": {"defaults":
    {"unit": "short"}, "overrides": []}}, {"id": 2, "title": "Requests per second",
    "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"expr": "sum by(service) (rate(http_requests_total[5m]))", "refId":
    "A"}], "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8}, "fieldConfig": {"defaults":
    {"unit": "reqps"}, "overrides": []}}, {"id": 3, "title": "Errors per second",
    "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"expr": "sum by(service,status) (rate(http_requests_total{status=~\"4..|5..\"}[5m]))",
    "refId": "A"}], "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8}, "fieldConfig": {"defaults":
    {"unit": "reqps"}, "overrides": []}}, {"id": 4, "title": "Mean request duration",
    "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"expr": "sum by(service) (rate(http_request_duration_seconds_sum[5m]))
    / sum by(service) (rate(http_request_duration_seconds_count[5m]))", "refId": "A"}],
    "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit":
    "s"}, "overrides": []}}]}'
